version: '3.8'

services:
  mariadb-potpotpotzh:
    image: mariadb:10.7.8
    environment:
      MARIADB_USER: potpotpotzh_user
      MARIADB_PASSWORD: PotPotPotZHPassword111
      MARIADB_ROOT_PASSWORD: PotPotPotZHPassword111
    ports:
      - "3306:3306"
    volumes:
      - ./mariadb:/docker-entrypoint-initdb.d:Z
